name: Wrong result
description: Report a false warning, false block, or missed failure
title: "[wrong result] "
labels: [wrong-result]
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities go to private reporting, not a public issue; see [SECURITY.md](https://github.com/tfpreflight/tfpreflight/blob/main/SECURITY.md).
  - type: dropdown
    id: kind
    attributes:
      label: What was wrong?
      options:
        - False warning
        - False block
        - Missed failure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what should have happened?
      description: Do not paste plans, credentials, account IDs, ARNs, or private resource names.
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Redacted report bundle
      description: Run `tfpreflight check --plan=tfplan --report=tfpreflight-report.json`, review the preview, then attach or paste the file. It excludes identifiers by default.
  - type: input
    id: terraform
    attributes:
      label: Terraform or OpenTofu version
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I reviewed the bundle and removed anything I do not want to share.
          required: true
