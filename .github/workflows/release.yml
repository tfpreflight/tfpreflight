name: Release tfpreflight

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The same gates as every push, run on the tag's own commit. Nothing below
  # runs unless all of them pass.
  gates:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Publishing holds the release and tap credentials, so it runs in the
  # release environment, where approvals and tag rules can be required.
  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # GoReleaser runs syft to write an SBOM for each archive.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # The installer lives on a release of its own. It is never marked
      # latest, and install.sh picks only v* tags, so it is never installed.
      - name: Publish stable installer asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view installer; then
            gh release create installer --title "tfpreflight installer" --notes "Stable asset for get.tfpreflight.dev." --latest=false
          fi
          gh release upload installer install.sh --clobber
