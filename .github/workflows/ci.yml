name: Go quality gates
# The release workflow calls this one on the tag's commit, so a release
# passes exactly these gates before anything is published.
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  # GOWORK=off: the module builds and tests from its own go.mod.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      # One run of every test, with the race detector. It includes the CLI
      # process tests and the pack consistency tests; formatting is checked
      # by gofumpt in the lint job.
      - run: go test -race -count=1 -timeout 20m ./...
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          test -z "$(gofumpt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
